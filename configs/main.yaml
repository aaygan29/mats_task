# REAL scientific run. Needs a GPU with >=16GB (Modal A10G via modal_run.py).
model_name: Qwen/Qwen3-4B
prompts_path: null
keep_rank: 8               # keep items answered within top-8 zero-shot
layers: null               # auto: evenly spaced across depth
n_layers_probe: 10
bake_positions: last       # single-token Jacobian at last token of each held-out sentence
bake_max_prompts: 125      # held-out corpus sentences for baking J + fitting a PROPERLY-TRAINED tuned lens
methods: [jlens, logit, tuned]   # tuned = learned-linear network-aware baseline
alphas: [0.5, 1.0, 2.0, 4.0]     # full curve reported; headline uses the gentlest (0.5)
tuned_ridge: 100.0
